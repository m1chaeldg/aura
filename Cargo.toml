[workspace]
members = [
    "crates/aura-core",
    "crates/aura-scripting",
    "crates/aura-engine",
    "crates/aura-sync",
    "crates/aura-ui",
]

[package]
name = "aura"
version = "0.1.0"
edition = "2021"

[dependencies]
aura-core = { path = "crates/aura-core" }
aura-scripting = { path = "crates/aura-scripting" }
aura-engine = { path = "crates/aura-engine" }
aura-sync = { path = "crates/aura-sync" }
aura-ui = { path = "crates/aura-ui" }
anyhow = "1"
gpui = "0.2.2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"

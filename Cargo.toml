[workspace]
members = [
    "crates/aura-core",
    "crates/aura-parser",
    "crates/aura-scripting",
    "crates/aura-engine",
    "crates/aura-sync",
    "crates/aura-ui",
]

[package]
name = "aura"
version = "0.1.0"
edition = "2021"

[lib]
name = "aura"
path = "src/lib.rs"

[[bin]]
name = "aura"
path = "src/main.rs"

[dependencies]
aura-core = { path = "crates/aura-core" }
aura-parser = { path = "crates/aura-parser" }
aura-scripting = { path = "crates/aura-scripting" }
aura-engine = { path = "crates/aura-engine" }
aura-sync = { path = "crates/aura-sync" }
aura-ui = { path = "crates/aura-ui" }
anyhow = "1"
gpui = { package = "gpui-pre", version = "0.3.9" }
gpui-kit = "0.7.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1.0"

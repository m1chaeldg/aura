[package]
name = "aura-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
aura-core = { path = "../aura-core" }
aura-engine = { path = "../aura-engine" }
aura-scripting = { path = "../aura-scripting" }
aura-sync = { path = "../aura-sync" }
aura-parser = { path = "../aura-parser" }
gpui = "0.2.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
toml = "0.8"
tokio-util = "0.7"
dirs = "5"
notify = "6.1"
rfd = "0.15"
tracing = "0.1"
